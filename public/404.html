<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Seite nicht gefunden</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#3a6fb5" />
<link rel="icon" href="data:," />
<style>html { background: #1f6fd0; } html.is-finding body { visibility: hidden; }</style>
<script>
  // GitHub Pages serves this page for any missing path, at any depth and under a project sub-path, so
  // relative links would point nowhere. Find the site root (the deepest parent folder with config.json),
  // then load the shared look from there and point the links there.
  document.documentElement.classList.add('is-finding');
  (async () => {
    const parts = location.pathname.split('/').slice(1, -1);
    const roots = parts.map((_, i) => '/' + parts.slice(0, parts.length - i).map((p) => p + '/').join('')).concat('/');
    const probe = (root) => fetch(root + 'config.json', { method: 'HEAD', cache: 'no-cache' })
      .then((r) => r.ok && /json/.test(r.headers.get('content-type') || ''), () => false);
    const found = await Promise.all(roots.map(probe));
    const root = roots[found.indexOf(true)] ?? './';
    const show = () => document.documentElement.classList.remove('is-finding');
    const css = Object.assign(document.createElement('link'), { rel: 'stylesheet', href: root + 'static.css', onload: show, onerror: show });
    setTimeout(show, 3000); // never stay blank
    document.head.append(css);
    for (const [rel, href, type] of [['icon', 'favicon.svg', 'image/svg+xml'], ['apple-touch-icon', 'apple-touch-icon.png']]) {
      document.head.append(Object.assign(document.createElement('link'), { rel, href: root + href, ...(type && { type }) }));
    }
    if (document.readyState === 'loading') await new Promise((r) => document.addEventListener('DOMContentLoaded', r));
    for (const a of document.querySelectorAll('a[data-root]')) a.href = root + (a.getAttribute('href') === './' ? '' : a.getAttribute('href'));
    const js = Object.assign(document.createElement('script'), { src: root + 'static.js', onload: () => fillBar(root) });
    document.head.append(js);
  })();
</script>
</head>
<body>
<header class="bar"><span class="mono" data-brand="monogram" aria-hidden="true"></span><strong class="brand" data-brand="name"></strong><a href="./" data-root>Zurück zum iPod</a><div class="right"><nav class="legal" aria-label="Rechtliches"><a href="impressum.html" data-root data-legal="impressum">Impressum</a><a href="datenschutz.html" data-root data-legal="datenschutz">Datenschutz</a></nav><time class="clock"></time></div></header>
<main class="win" aria-labelledby="wt">
  <div class="titlebar"><div class="lights" aria-hidden="true"><i></i><i></i><i></i></div><h1 id="wt">Seite nicht gefunden</h1><span></span></div>
  <div class="content">
    <div class="paper">
      <h2>Seite nicht gefunden</h2>
      <p>Diese Seite gibt es leider nicht. Vielleicht hat sich ein Tippfehler in die Adresse geschlichen, oder der Link ist veraltet.</p>
      <p>Alle Links findest du auf dem iPod auf der Startseite.</p>
    </div>
  </div>
  <div class="foot"><a class="btn" href="./" data-root>Zurück zum iPod</a></div>
</main>
</body>
</html>
