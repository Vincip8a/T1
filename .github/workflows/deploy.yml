name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Laufende Deployments nicht abbrechen, neue dahinter einreihen.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Pages konfigurieren
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Abhängigkeiten installieren
        run: npm ci

      # Social-Vorschaubild, Icons und Standard-Cover mit Name und Kürzel aus public/config.json.
      # Nutzt das Chrome des Runners; schlägt es fehl, bleiben die Bilder aus dem Repo.
      - name: Vorschaubild und Icons erzeugen
        run: node tools/make-og.mjs && node tools/make-icons.mjs
        continue-on-error: true

      - name: Projekt bauen
        run: npm run build
        env:
          # Absolute Adresse für og:image / og:url (funktioniert auch mit eigener Domain)
          SITE_URL: ${{ steps.pages.outputs.base_url }}/

      - name: Build-Ergebnis hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
